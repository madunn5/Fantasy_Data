{% extends "draftgame/base.html" %}
{% load i18n %}

{% block content %}
<div class="card" style="max-width: 460px; margin: 1rem auto;">
    <h2>Finish signing in</h2>
    <p style="color: var(--text-secondary); margin-bottom: 1rem;">
        You're signing in with Google. Pick a username to finish and you're all set.
    </p>
    <form method="post" action="{% url 'socialaccount_signup' %}">
        {% csrf_token %}
        {{ form.as_p }}
        {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
        {% endif %}
        <button type="submit" class="btn" style="margin-top: 0.5rem;">Create account</button>
    </form>
</div>
{% endblock %}
