{% extends 'draftgame/base.html' %}

{% block content %}
<div class="card">
    <h1>🪣 Bucket of Death - Week {{ session.week_number }}</h1>
    {% if session.is_test_mode %}
        <span style="background: var(--bg-warning); border: 1px solid rgba(255,213,107,0.45); color: var(--text-warning); padding: 0.5rem 1rem; border-radius: 20px; font-weight: bold;">TEST MODE</span>
    {% endif %}
    
    <div style="color: var(--text-danger); font-size: 1.2em; margin: 1rem 0;">
        <strong>{{ session.punishment }}</strong>
    </div>
    
    <div class="card" style="background: var(--surface-2); text-align: center; margin: 2rem 0;">
        <h2>{{ session.current_player }} is rummaging...</h2>
        <div id="rummaging" style="font-size: 2em; margin: 2rem 0;">
            🪣 <span id="dots">.</span>
        </div>
        <div id="result" style="display: none;">
            <span class="eyebrow">The bucket offers</span>
            <div style="font-family: var(--font-display); font-size: 2.2em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-primary); margin: 0.75rem 0;">
                {{ selected_team }}
            </div>
            <a href="{% url 'draftgame:bucket_decision' %}" class="btn" style="margin-top: 1rem;">
                Continue
            </a>
        </div>
    </div>
</div>

<script>
let dotCount = 1;
const maxDots = 5;
const rummageTime = 2000; // 2 seconds

function animateDots() {
    const dotsElement = document.getElementById('dots');
    dotsElement.textContent = '.'.repeat(dotCount);
    dotCount = dotCount >= maxDots ? 1 : dotCount + 1;
}

// Start dot animation
const dotInterval = setInterval(animateDots, 200);

// Show result after rummage time
setTimeout(() => {
    clearInterval(dotInterval);
    document.getElementById('rummaging').style.display = 'none';
    document.getElementById('result').style.display = 'block';
}, rummageTime);
</script>
{% endblock %}
