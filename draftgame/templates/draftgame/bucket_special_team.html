{% extends 'draftgame/base.html' %}

{% block content %}
<div class="card">
    <h1>🪣 Bucket of Death - Week {{ session.week_number }}</h1>
    
    <div style="color: var(--text-danger); font-size: 1.2em; margin: 1rem 0;">
        <strong>{{ session.punishment }}</strong>
    </div>
    
    <div class="card" style="background: var(--surface-2); text-align: center; margin: 2rem 0;">
        <h2>{{ session.current_player }}'s Special Team:</h2>
        <div style="font-size: 1.5em; font-weight: bold; color: var(--text-accent); margin: 1rem 0;">
            {{ special_team }}
        </div>
        <p style="margin: 1rem 0;">Choose which team this represents:</p>
    </div>

    <form method="post" style="text-align: center;">
        {% csrf_token %}
        <div style="margin: 2rem 0;">
            <label style="display: block; margin-bottom: 0.5rem; font-size: 1.1em;">Enter team name:</label>
            <input type="text" name="chosen_team" required 
                   style="padding: 0.75rem; border-radius: 10px; border: 1px solid var(--border-strong); 
                          background: rgba(255,255,255,0.06); color: #fff; width: 300px; max-width: 100%; 
                          font-size: 1.1em; text-align: center;"
                   placeholder="e.g., New York Giants">
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <button type="submit" class="btn" style="background: #2f9e63; border-color: #2f9e63; font-size: 1.2em; padding: 1rem 2rem;">
                ✅ Confirm Selection
            </button>
        </div>
    </form>
    
    <form method="post" style="text-align: center; margin-top: 1rem;">
        {% csrf_token %}
        <input type="hidden" name="action" value="decide_later">
        <button type="submit" class="btn btn-secondary" style="font-size: 1.1em; padding: 0.75rem 1.5rem;">
            🤔 Decide Later
        </button>
    </form>
</div>


{% endblock %}
