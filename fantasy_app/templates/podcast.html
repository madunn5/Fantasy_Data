{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ ep.title }}</title>

  {# Link previews (Discord, iMessage, Slack) read these and never run the script below. #}
  <meta property="og:site_name" content="Dunn Right Fantasy">
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="{{ ep.title }}">
  <meta property="og:description" content="{{ ep.description }}">
  <meta property="og:image" content="{% if ep.image %}{{ ep.image }}{% else %}https://i.ytimg.com/vi/{{ ep.youtube_id }}/hqdefault.jpg{% endif %}">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0c0d10">

  <style>
    :root { --bg: #0c0d10; --ink: #f2f2f0; --muted: #8a8d93; --volt: #e8ff47; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: "Barlow", system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { margin: 0; font-family: "Barlow Condensed", "Barlow", system-ui, sans-serif;
      font-weight: 600; text-transform: uppercase; font-size: 28px; letter-spacing: .02em; }
    p { margin: 0; color: var(--muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--volt);
      animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    a { color: var(--volt); }
    #payoff { display: none; position: fixed; inset: 0; background: #000; }
    #payoff video, #payoff img { width: 100%; height: 100%; object-fit: contain; }
    body.reveal #loading { display: none; }
    body.reveal #payoff { display: block; }
  </style>
</head>
<body>
  <main id="loading">
    <span class="dot"></span>
    <h1>{{ ep.title }}</h1>
    <p class="sub">Hang tight, sending you to the video.</p>
    {% if ep.redirect %}
    <noscript><p><a href="{{ ep.redirect }}">Tap here if it doesn't open.</a></p></noscript>
    {% endif %}
  </main>

  {% if ep.audio %}
  <audio id="clip" preload="auto" loop src="{% static ep.audio %}"></audio>
  {% endif %}

  {% if ep.gif_mp4 %}
  <div id="payoff">
    <video autoplay muted loop playsinline preload="auto" src="{{ ep.gif_mp4 }}">
      <img src="{{ ep.gif }}" alt="">
    </video>
  </div>
  {% endif %}

  <script>
    {% if ep.redirect %}
    setTimeout(function () {
      window.location.replace("{{ ep.redirect|escapejs }}");
    }, 700);
    {% else %}
    var v = document.querySelector("#payoff video");
    var clip = document.getElementById("clip");
    var loading = document.getElementById("loading");

    function fallback() {
      var img = document.createElement("img");
      img.src = "{{ ep.gif|escapejs }}";
      v.replaceWith(img);
      v = null;
    }
    // The clip is padded to the gif's length, so both loop on the same
    // period. Start them together so they stay lined up.
    function startShow() {
      document.body.classList.add("reveal");
      if (clip && !clip.paused) { clip.currentTime = 0; }
      if (v) {
        v.currentTime = 0;
        // The first frame can lag the audio while the mp4 buffers, so
        // snap the clip back to 0 the moment the video actually starts.
        v.addEventListener("playing", function () {
          if (clip && !clip.paused) { clip.currentTime = 0; }
        }, { once: true });
        var p = v.play();
        if (p && p.catch) { p.catch(fallback); }
      }
    }
    if (v) { v.addEventListener("error", fallback); }
    // Browsers pause background video. Resume when the tab comes back.
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && document.body.classList.contains("reveal")) {
        if (clip && !clip.paused) { clip.currentTime = 0; }
        if (v) { v.currentTime = 0; v.play().catch(function () {}); }
      }
    });

    // Sound needs a user gesture in most browsers. Show the gif regardless,
    // and if the audio was refused, the first tap anywhere starts it and
    // restarts the gif so they stay lined up.
    function armTapToUnmute() {
      var arm = function () {
        document.removeEventListener("pointerdown", arm);
        document.removeEventListener("keydown", arm);
        if (clip) { clip.currentTime = 0; clip.play().catch(function () {}); }
        startShow();
      };
      document.addEventListener("pointerdown", arm);
      document.addEventListener("keydown", arm);
    }

    setTimeout(function () {
      if (!clip) { startShow(); return; }
      var p = clip.play();
      if (!p || !p.then) { startShow(); return; }
      p.then(startShow, function () { startShow(); armTapToUnmute(); });
    }, 3000);
    {% endif %}
  </script>
</body>
</html>
